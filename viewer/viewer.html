<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartFill · Order review</title>
  <link rel="stylesheet" href="../sidepanel/sidepanel.css">
  <link rel="stylesheet" href="viewer.css">
</head>
<body class="viewer">
  <header class="top vtop">
    <span class="brand" id="brand"><img class="mark" src="../icons/brand/boost-star.png" alt="SmartFill"></span>
    <span class="product">SmartFill</span>
    <div class="vorder"><b id="vOrder">Loading…</b><span id="vAddr" class="muted"></span></div>
    <nav class="vtabs" role="tablist" aria-label="View">
      <button role="tab" data-view="photos" aria-selected="true">Photos <span class="n" id="nPhotos">0</span></button>
      <button role="tab" data-view="narrative" aria-selected="false">Narrative <span class="n" id="nNarr">0</span></button>
    </nav>
    <button id="btnRefresh" class="icon-btn" title="Reload the latest review" aria-label="Reload the latest review">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
    </button>
    <button id="btnTheme" class="icon-btn" title="Theme" aria-label="Theme">
      <svg class="ic-auto" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></svg>
      <svg class="ic-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="ic-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
  </header>

  <!-- Photos: every photo of the order in one grid -->
  <section id="viewPhotos" class="vview">
    <div class="vbar">
      <div class="filters" id="pFilters" role="group" aria-label="Photo filter"></div>
      <input id="pSearch" type="search" placeholder="Search captions or photo id" aria-label="Search photos">
      <div class="seg vsize" role="radiogroup" aria-label="Tile size">
        <span class="small muted">Size</span>
        <button role="radio" data-size="s" aria-checked="false">S</button><button role="radio" data-size="m" aria-checked="true">M</button><button role="radio" data-size="l" aria-checked="false">L</button>
      </div>
    </div>
    <p id="pNote" class="small muted vnote" hidden></p>
    <div id="pGrid" class="vgrid" data-size="m"></div>
  </section>

  <!-- Narrative: the full text with the issue sentences highlighted -->
  <section id="viewNarrative" class="vview" hidden>
    <div class="vbar">
      <div id="nMode" class="filters" role="group" aria-label="Which text" hidden>
        <button data-mode="current" aria-pressed="true">Current</button><button data-mode="draft" aria-pressed="false">Draft</button>
      </div>
      <span id="nStats" class="small muted"></span>
      <span class="vspacer"></span>
      <button id="nCopy" class="ghost sm">Copy text</button>
    </div>
    <div class="ncols">
      <article id="nText" class="ntext" aria-label="Narrative text"></article>
      <aside class="nside" aria-label="Narrative issues"><h3>Issues</h3><div id="nIssues"></div></aside>
    </div>
  </section>

  <!-- Photo viewer: zoom / pan as in NSR, with the AI's notes beside the photo -->
  <div id="pv" class="pv" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
    <div class="pv-main">
      <div class="lb-top"><span class="lb-cap" id="pvCap"></span>
        <button class="lb-btn" data-pv="prev" title="Previous (←)" aria-label="Previous photo">‹</button>
        <span class="lb-zoom" id="pvPos"></span>
        <button class="lb-btn" data-pv="next" title="Next (→)" aria-label="Next photo">›</button>
        <span class="pv-sep"></span>
        <button class="lb-btn" data-pv="out" title="Zoom out (−)" aria-label="Zoom out">−</button><span class="lb-zoom" id="pvZoom">100%</span>
        <button class="lb-btn" data-pv="in" title="Zoom in (+)" aria-label="Zoom in">+</button>
        <button class="lb-btn" data-pv="fit" title="Fit (0)">Fit</button>
        <button class="lb-btn" data-pv="info" title="Show or hide notes (I)" aria-label="Show or hide notes">Notes</button>
        <button class="lb-btn" data-pv="close" title="Close (Esc)" aria-label="Close">✕</button></div>
      <div class="lb-stage" id="pvStage"><img id="pvImg" alt="" draggable="false"></div>
      <div class="pv-strip" id="pvStrip" aria-label="All photos"></div>
    </div>
    <aside class="pv-info" id="pvInfo"></aside>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"><span id="toastText"></span><button id="toastAction" class="toast-action" hidden></button></div>
  <script type="module" src="viewer.js"></script>
</body>
</html>
